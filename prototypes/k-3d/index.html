<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meanwhile... (K 3D prototype)</title>
<!-- K "Meanwhile..." as a third-person shooter, Nitrate look. Needs an internet connection: three.js, the stand-in
     robot (RobotExpressive, CC0) and the fonts come from CDNs. Opens straight from file://. Notes: NOTES.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Josefin+Sans:wght@600;700&family=Limelight&display=swap">
<style>
  :root { --ink: #0D0C0B; --paper: #F1EADB; --bone: #C9C2B4; --silver: #7A756D; --red: #D3301F; --gold: #E9B949; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper);
    font: 700 13px 'Josefin Sans', system-ui, sans-serif; letter-spacing: .08em; user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .abs { position: fixed; pointer-events: none; }
  #picture { position: absolute; inset: 0; border-radius: 2.5vh; overflow: hidden; }
  .corner { position: absolute; width: 2.6vh; height: 2.6vh; }
  #pov { overflow: hidden; }
  #roomName { text-align: center; text-transform: uppercase; letter-spacing: .3em; font-size: 1.7vh; opacity: .85; }
  .cameo { position: fixed; pointer-events: none; text-align: center; }
  .cameo .mask { position: absolute; left: 0; top: 0; border-radius: 50%;
    background: radial-gradient(circle closest-side, transparent 96%, var(--ink) 97.5%); }
  .cameo .ring { position: absolute; left: 0; top: 0; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--paper); }
  .cameo .lab { position: absolute; left: -10px; right: -10px; text-transform: uppercase; letter-spacing: .15em; font-size: 1.6vh; line-height: 1.35; }
  .cameo .lab small { display: block; font-size: 1.25vh; opacity: .7; }
  .cameo .bar, .hbar { height: .9vh; background: rgba(241,234,219,.15); position: relative; }
  .cameo .bar { position: absolute; left: 12%; right: 12%; }
  .cameo .bar i, .hbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--paper); }
  .cameo .st { position: absolute; left: 0; right: 0; font-size: 1.5vh; letter-spacing: .2em; }
  .cameo .tag { position: absolute; left: 0; right: 0; font-size: 1.2vh; letter-spacing: .18em; opacity: 0; }
  .cameo.cue .tag { opacity: 1; }
  .cameo .nosig { position: absolute; left: 0; top: 0; border-radius: 50%; display: grid; place-items: center;
    background: #1a1816; font: italic 400 1.7vh 'IM Fell English', serif; letter-spacing: 0; color: var(--bone); opacity: 0; }
  .cameo.off .nosig { opacity: 1; }
  .cameo.danger .ring { border-color: var(--red); animation: flash .33s steps(2) infinite; }
  .cameo.danger .bar i { background: var(--red); }
  .cameo.danger .st { color: var(--red); }
  .cameo.hit .ring { transform: scale(1.06); }
  .cameo.reject { animation: shake .25s; }
  @keyframes flash { 50% { border-color: var(--paper); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #reel { text-transform: uppercase; }
  #reel b { display: block; letter-spacing: .3em; font-size: 1.6vh; opacity: .8; }
  #feet { display: block; font: 400 4.4vh Limelight, serif; letter-spacing: 0; line-height: 1.1; }
  #feet small { font: 700 1.4vh 'Josefin Sans'; letter-spacing: .2em; opacity: .7; }
  #chain { display: block; font-size: 1.6vh; color: var(--paper); opacity: 0; letter-spacing: .15em; }
  #heroCard { text-transform: uppercase; }
  #hName { font: 400 3.2vh Limelight, serif; letter-spacing: .02em; }
  #hName small { font: 700 1.3vh 'Josefin Sans'; letter-spacing: .2em; opacity: .7; display: block; }
  #heroCard .hbar { margin: .7vh 0; }
  #heroCard.low .hbar i { background: var(--red); }
  #armorTag { font-size: 1.3vh; letter-spacing: .15em; margin-bottom: .8vh; }
  #armorTag.on { color: var(--gold); }
  #armorTag.gone { color: var(--red); }
  #ammo { display: flex; flex-wrap: wrap; gap: .35vh; margin: .5vh 0 .9vh; }
  #ammo i { width: .55vh; height: 1.8vh; background: var(--paper); }
  #ammo i.spent { background: rgba(241,234,219,.18); }
  #ammo.reload i { animation: flash2 .3s steps(2) infinite; }
  @keyframes flash2 { 50% { opacity: .2; } }
  #scriptSt { font-size: 1.35vh; letter-spacing: .15em; border: 2px solid var(--paper); padding: .5vh .7vh; display: inline-block; }
  #scriptSt.off { background: var(--paper); color: var(--ink); }
  #keysHelp { font-size: 1.2vh; letter-spacing: .12em; opacity: .55; line-height: 1.6; margin-top: 1.2vh; }
  /* in-picture overlays */
  #xhair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 30; }
  #xhair i { position: absolute; background: var(--paper); box-shadow: 0 0 0 1px rgba(13,12,11,.6); }
  #xhair .dot { width: 3px; height: 3px; left: -1.5px; top: -1.5px; }
  #hitm { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; z-index: 31; opacity: 0;
    background: linear-gradient(45deg, transparent 46%, var(--paper) 46%, var(--paper) 54%, transparent 54%),
                linear-gradient(-45deg, transparent 46%, var(--paper) 46%, var(--paper) 54%, transparent 54%); }
  #hitm.head { background: linear-gradient(45deg, transparent 44%, var(--gold) 44%, var(--gold) 56%, transparent 56%),
                linear-gradient(-45deg, transparent 44%, var(--gold) 44%, var(--gold) 56%, transparent 56%); }
  .arc { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 29; opacity: 0; }
  .arc i { position: absolute; left: -7vh; top: -17vh; width: 14vh; height: 3vh; border-top: .8vh solid var(--red); border-radius: 50% 50% 0 0; }
  #vig { position: absolute; inset: 0; z-index: 12; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(13,12,11,.9) 100%); }
  #redVig { position: absolute; inset: 0; z-index: 12; opacity: 0; box-shadow: inset 0 0 9vh var(--red); }
  #prompt { position: absolute; left: 0; right: 0; bottom: 13%; text-align: center; z-index: 30; font-size: 1.8vh; letter-spacing: .15em; text-transform: uppercase; }
  #prompt span { border: 2px solid var(--paper); padding: .6vh 1.2vh; background: rgba(13,12,11,.55); }
  #prompt span.red { border-color: var(--red); color: var(--paper); background: var(--red); }
  #cue { position: absolute; left: 0; right: 0; top: 3%; text-align: center; z-index: 30; font-size: 1.6vh; letter-spacing: .2em; text-transform: uppercase; opacity: 0; }
  #cue b { font: 400 2.6vh Limelight, serif; letter-spacing: .05em; }
  #stamp { position: absolute; right: 4%; top: 10%; z-index: 32; font: 400 3.2vh Limelight, serif; padding: .6vh 1.4vh;
    border: 3px solid var(--paper); transform: rotate(-8deg) scale(1.4); opacity: 0; }
  #stamp.show { animation: stamp 1.6s forwards; }
  @keyframes stamp { 0% { opacity: 0; transform: rotate(-8deg) scale(1.6); } 8% { opacity: 1; transform: rotate(-8deg) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: rotate(-8deg) scale(1); } }
  #jit { position: absolute; left: 0; right: 0; top: 13%; text-align: center; z-index: 33; color: var(--gold); opacity: 0;
    font: 400 7.6vh Limelight, serif; text-shadow: 0 .4vh 0 var(--ink); }
  #jit small { display: block; font: italic 400 3vh 'IM Fell English', serif; color: var(--paper); }
  #icard { position: absolute; left: 20%; right: 20%; bottom: 5%; z-index: 34; background: var(--ink); text-align: center;
    font: italic 400 3.3vh 'IM Fell English', Georgia, serif; letter-spacing: 0; padding: 2.2vh 2vh; opacity: 0;
    outline: 3px solid var(--paper); outline-offset: -12px; box-shadow: inset 0 0 0 19px var(--ink), inset 0 0 0 20px var(--paper); }
  #icard small { display: block; font: 700 1.3vh 'Josefin Sans'; font-style: normal; letter-spacing: .25em; text-transform: uppercase; opacity: .7; margin-top: .6vh; }
  #actCard { position: absolute; inset: 0; z-index: 40; background: var(--ink); display: none; place-items: center; text-align: center;
    outline: 3px solid var(--paper); outline-offset: -2.4vh; box-shadow: inset 0 0 0 3.6vh var(--ink), inset 0 0 0 3.75vh var(--paper); }
  #actCard.show { display: grid; }
  #actCard .k { font-size: 1.8vh; letter-spacing: .4em; opacity: .75; }
  #actCard .t { font: 400 7.5vh Limelight, serif; margin: 1.4vh 0; }
  #actCard .s { font: italic 400 3vh 'IM Fell English', serif; letter-spacing: 0; max-width: 44vh; margin: 0 auto; }
  #actCard .skip { font-size: 1.3vh; letter-spacing: .25em; opacity: .5; margin-top: 4vh; }
  #pops { position: absolute; inset: 0; z-index: 31; }
  .pop { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 400 2.5vh Limelight, serif;
    text-shadow: 0 2px 0 var(--ink); transition: transform .9s ease-out, opacity .9s ease-in; }
  .pop small { display: block; font: 700 1.3vh 'Josefin Sans'; letter-spacing: .18em; text-align: center; }
  .pop.gold { color: var(--gold); }
  #armorTxt { position: absolute; left: 0; right: 0; top: 60%; text-align: center; z-index: 30; color: var(--gold);
    font-size: 1.9vh; letter-spacing: .35em; opacity: 0; }
  #banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; z-index: 33; opacity: 0;
    font: italic 400 3.4vh 'IM Fell English', serif; letter-spacing: 0; text-shadow: 0 2px 0 var(--ink); }
  #banner small { display: block; font: 700 1.5vh 'Josefin Sans'; font-style: normal; letter-spacing: .2em; text-transform: uppercase; }
  /* full screens */
  #screen { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: rgba(13,12,11,.94); text-align: center; }
  #screen.show { display: grid; }
  #screen .box { max-width: 120vh; padding: 2vh; }
  #screen h1 { font: 400 11vh Limelight, serif; margin: 0; letter-spacing: .02em; white-space: nowrap; }
  #screen h2 { font: italic 400 3.4vh 'IM Fell English', serif; margin: 1vh 0 3vh; letter-spacing: 0; }
  #screen .how { font-size: 1.75vh; line-height: 2.1; letter-spacing: .12em; text-transform: uppercase; }
  #screen .how b { border: 2px solid var(--paper); padding: .1vh .6vh; margin: 0 .2vh; }
  #screen .go { margin-top: 3.5vh; font: 400 3.4vh Limelight, serif; animation: flash2 1.2s steps(2) infinite; }
  #screen .note { margin-top: 1.4vh; font: italic 400 2vh 'IM Fell English', serif; opacity: .75; letter-spacing: 0; }
  #screen .medal { width: 12vh; height: 12vh; border-radius: 50%; margin: 1.4vh auto; display: grid; place-items: center;
    font: 400 6vh Limelight, serif; color: var(--ink); background: var(--bone); box-shadow: 0 0 0 .5vh var(--ink), 0 0 0 .8vh var(--bone); }
  #screen .medal.gold { background: var(--gold); box-shadow: 0 0 0 .5vh var(--ink), 0 0 0 .8vh var(--gold); }
  #screen .medal.none { background: #2a2724; color: var(--bone); box-shadow: 0 0 0 .5vh var(--ink), 0 0 0 .8vh #2a2724; }
  #screen .medal small { display: block; font: 700 .85vh 'Josefin Sans'; letter-spacing: .15em; margin-top: -1.5vh; }
  #screen table { margin: 1.2vh auto 0; border-collapse: collapse; font-size: 1.7vh; letter-spacing: .1em; text-transform: uppercase; }
  #screen td { padding: .25vh 1.5vh; text-align: left; }
  #screen td:last-child { text-align: right; font: 400 2.2vh Limelight, serif; letter-spacing: .02em; }
  #screen .cmp { margin-top: 2.2vh; font: italic 400 2.3vh 'IM Fell English', serif; letter-spacing: 0; line-height: 1.5; }
  #screen .cmp b { font: 700 1.4vh 'Josefin Sans'; font-style: normal; letter-spacing: .2em; display: block; text-transform: uppercase; opacity: .7; }
  .gold { color: var(--gold); }
  .redt { color: var(--red); }
  #dbg { position: fixed; right: 0; top: 0; bottom: 0; width: 300px; overflow: auto; z-index: 80; background: rgba(13,12,11,.95);
    font: 11px ui-monospace, Menlo, monospace; letter-spacing: 0; padding: 8px; display: none; }
  #dbg.show { display: block; }
  #dbg label { display: flex; justify-content: space-between; gap: 6px; margin: 2px 0; }
  #dbg input[type=number] { width: 70px; background: #222; color: #eee; border: 1px solid #444; font: inherit; }
  #dbg button { font: inherit; margin: 6px 4px 0 0; }
  #err { position: fixed; left: 0; right: 0; top: 0; z-index: 99; background: var(--red); color: #fff; padding: 10px; font: 13px ui-monospace, monospace; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gate" class="abs"><div id="picture"></div>
  <div class="corner" id="k0"></div><div class="corner" id="k1"></div><div class="corner" id="k2"></div><div class="corner" id="k3"></div></div>
<div id="roomName" class="abs"></div>
<div class="cameo" id="cm0"><div class="nosig"></div><div class="mask"></div><div class="ring"></div><div class="tag">THE SCRIPT WANTS THIS</div><div class="st"></div><div class="lab"></div><div class="bar"><i></i></div></div>
<div class="cameo" id="cm1"><div class="nosig"></div><div class="mask"></div><div class="ring"></div><div class="tag">THE SCRIPT WANTS THIS</div><div class="st"></div><div class="lab"></div><div class="bar"><i></i></div></div>
<div id="reel" class="abs"><b id="reelN">REEL 1</b><span id="feet">0</span><small id="chain"></small></div>
<div id="heroCard" class="abs"><div id="hName"></div><div class="hbar"><i id="hBar"></i></div><div id="armorTag"></div>
  <div id="ammo"></div><div id="scriptSt">ON SCRIPT</div>
  <div id="keysHelp">1 2 3 CUT · TAB BACK TO SCRIPT<br>SPACE COVER · SHIFT DODGE<br>R RELOAD · F GUN-FU · ESC PAUSE</div></div>
<div id="pov" class="abs">
  <div id="vig"></div><div id="redVig"></div>
  <div id="xhair"><i class="dot"></i><i id="xl"></i><i id="xr"></i><i id="xt"></i><i id="xb"></i></div>
  <div id="hitm"></div>
  <div class="arc" id="arc0"><i></i></div><div class="arc" id="arc1"><i></i></div><div class="arc" id="arc2"><i></i></div><div class="arc" id="arc3"><i></i></div>
  <div id="armorTxt">PLOT ARMOR</div>
  <div id="prompt"></div><div id="cue"></div><div id="stamp">OFF SCRIPT</div>
  <div id="banner"></div><div id="jit"></div><div id="icard"></div><div id="pops"></div>
  <div id="actCard"><div><div class="k" id="acK"></div><div class="t" id="acT"></div><div class="s" id="acS"></div><div class="skip">SPACE TO SKIP</div></div></div>
</div>
<div id="screen" class="show"><div class="box" id="screenBox">
  <h1>Meanwhile...</h1><h2>Loading the reel...</h2></div></div>
<div id="dbg"></div><div id="err"></div>

<!-- ===================================================================================
     RULES: plain JS, no DOM, no three.js. bots.js runs this exact block in Node.
     Units are metres and seconds. Each set keeps local x/z; the renderer adds the set's cx.
     =================================================================================== -->
<script id="rules">
const CONFIG = {
  // --- the film ---
  thirdHero: true,          // a third hero (Juno) joins in Act Two
  loneArmor: false,         // false: a hero with nobody left to cut to loses plot armor
  actHeal: 0.3,             // health every survivor gets back between acts
  firstBruteAt: 20,         // s into Act One when the first heavy walks into the Railway
  act1Min: 70, act1Max: 125, act2Min: 80, act2Max: 150, // act length (s): ends after min once its heavies are dealt with
  cardTime: 3.6,            // act title card (s); SPACE skips
  wrapTime: 2.4,            // beat after the last heavy falls / everyone dies, before the end card
  // --- the studio's script ---
  scriptAuto: true,         // on script, the film cuts itself to whoever the script wants
  cueWarn: 3,               // s of countdown before a scripted cut
  // --- you: the hero on camera ---
  heroSpeed: 6, aimSpeed: 3.2, coverSpeed: 2.8, heroAccel: 16,
  fireInterval: 0.16, magSize: 12, reloadTime: 1.25, fireRange: 60,
  spreadHip: 0.025, spreadMove: 0.045, spreadAim: 0.004, spreadBlind: 0.1, recoil: 0.01, aimAssist: 0.12,
  bodyDmg: 1, headDmg: 3, bigHeadDmg: 2, mookHp: 2, // two to the body or one to the head
  meleeRange: 2.4, meleeCooldown: 0.7, meleeTime: 0.4, meleeBruteDmg: 3,
  coverReach: 1.5, coverLeave: 0.2, // SPACE takes cover within this gap; pull away this long to leave
  dodgeTime: 0.34, dodgeSpeed: 12, dodgeIframes: 0.42, dodgeCooldown: 0.5,
  knockdownTime: 1.0, knockback: 6,
  camDamageMult: 0.75,      // on camera you do get hurt...
  armorFloor: 0.12,         // ...but plot armor stops you here
  regenDelay: 2.5, regenRate: 0.07, regenCoverMult: 2, // on camera only, after this long unhurt
  // --- camera rig (shared by the renderer and the shot ray) ---
  camDist: 5.0, camSide: 1.3, camUp: 0.8, camPivot: 1.55, crouchPivot: 1.0, aimDist: 2.7, aimSide: 1.35,
  camFov: 60, aimFov: 40, pitchMin: -0.6, pitchMax: 0.75, mouseSens: 0.0022,
  // --- heroes off camera (simple AI) ---
  aiSpeed: 3.6, aiFireInterval: 1.0, aiAccMook: 0.45, aiCoverPenalty: 0.5, aiBruteAcc: 0.5, aiBruteDmg: 0.25,
  aiDodge: 0.3, aiRange: 22, aiKnockdownTime: 0.7,
  // --- mooks: they take cover and pop up to shoot ---
  mookSpeed: 3.4, mookFireMin: 1.3, mookFireMax: 2.3, mookAim: 0.55, mookUpTime: 0.6, mookAcc: 0.5, mookDamage: 0.035,
  mookRelocMin: 7, mookRelocMax: 12, mookRushChance: 0.18,
  maxMooks: 4, maxMooksA2: 5, maxMooksFinale: 7,
  mookIntervalA1: 2.8, mookIntervalA2: 2.4, mookIntervalA3: 2.0, mookRamp: 0.7, // s between mooks per set; x ramp over 60 s
  // --- heavies ---
  bruteHp: 30, bruteSpeed: 3.3, slamRange: 3.2, slamRadius: 3.1, slamWind: 0.7, slamRecover: 1.2, slamDamage: 0.2,
  chargeMin: 10, chargeWind: 0.65, chargeTime: 0.85, chargeSpeed: 14, chargeHitR: 1.5, chargeRecover: 1.4,
  chargeDamage: 0.15, chargeCooldown: 4,
  recoverDamageMult: 2,     // shots during a heavy's recovery do this much more
  // --- the Bull (finale) ---
  bullHp: 110, bullSpeed: 3.7, bullSlamDamage: 0.22, bullOffCamBias: 0.75, // chance it picks a hero who is NOT on camera
  // --- cutting and score (score is in feet of film) ---
  cutCooldown: 0.35,
  bonusStart: 0.5, tierClose: 0.25, tierJIT: 0.12, // health on arrival: under 50% pays, under 12% is JUST IN TIME
  bonusMax: 2500, bonusPow: 1.4, bonusBruteMult: 1.5,
  bonusMinAway: 2, bonusMinLoss: 0.08, // no bonus unless they were away 2 s and lost 8% (stops cut ping-pong)
  killPoints: 50, chainWindow: 2.2, chainMax: 4, pointBlank: 2.5, pointBlankBonus: 50, headshotBonus: 50,
  meleeBonus: 150, dodgeBonus: 150, brutePoints: 1500, bullPoints: 4000, survivorBonus: 2500,
  star1: 6000, star2: 12000, star3: 20000, star4: 28000, star5: 36000,
  dcMinOff: 15,             // s off script before your edit counts as a Director's Cut
  corpseTime: 7,
  // --- feedback only ---
  hints: true, shake: 1, volume: 0.6, music: 0.7, slowmo: 0.3,
};
const DEFAULTS = JSON.parse(JSON.stringify(CONFIG));

const ARENA_HW = 18, ARENA_HD = 13, WALL_H = 4.2, HERO_R = 0.42;
// body sizes; the head is a sphere at HEAD_Y * height with radius HEAD_R * height (fitted to the stand-in robot)
const DIM = { hero: { r: 0.42, h: 1.8 }, mook: { r: 0.42, h: 1.8 }, brute: { r: 0.8, h: 2.6 }, bull: { r: 1.1, h: 3.1 } };
const HEAD_Y = 0.79, HEAD_R = 0.15, CROUCH = 0.62;
// obstacles: [x, z, half width, half depth, height]. Under 1.5 m is low cover (crouch behind it, aim over it).
const SETS = [
  { key: 'mill', name: 'THE MILL', where: 'at the Mill', tone: 'amber', cx: 0, spawn: [0, -6], time: '11:58 PM',
    obstacles: [[-8, -3, 2.2, 0.6, 1.1], [8, -3, 2.2, 0.6, 1.1], [0, 3, 1.4, 1.4, 1.15], [-11, 6, 0.6, 0.6, 3.4], [11, 6, 0.6, 0.6, 3.4],
      [-4, 9, 2.5, 0.6, 1.1], [5, 9.5, 1.5, 1, 1.15], [0, -10, 0.6, 0.6, 3.4], [-14, -8, 1, 1, 1.15], [14, -8, 1, 1, 1.15]],
    doors: [[-18, 0], [18, 0], [-10, 13], [10, 13], [-15, -13], [15, -13]] },
  { key: 'rail', name: 'THE RAILWAY', where: 'at the Railway', tone: 'green', cx: 400, spawn: [0, -6], time: '11:58 PM',
    obstacles: [[-6, 4, 5, 1.3, 3.0], [9, -1, 1.2, 4, 3.0], [-12, -4, 1, 1, 1.15], [3, 9, 2, 0.6, 1.1], [-3, -7.2, 1.5, 0.5, 1.0],
      [13, 8, 1, 1, 1.15], [5, -10, 1, 0.6, 1.1], [-14, 9, 1.2, 0.6, 1.1]],
    doors: [[-18, -6], [-18, 9], [18, -7], [18, 7], [-9, -13], [9, 13]] },
  { key: 'roof', name: 'THE ROOFTOP', where: 'on the Rooftop', tone: 'night', cx: 800, spawn: [0, -6], time: '12:31 AM',
    obstacles: [[-8, 3, 1.8, 1.2, 1.1], [8, 3, 1.8, 1.2, 1.1], [-12, -6, 0.8, 0.8, 3.0], [12, -6, 0.8, 0.8, 3.0], [0, 9.5, 2.5, 1, 1.2],
      [0, 2, 1.2, 1.2, 2.6], [-4, -9.5, 1.2, 0.6, 1.1], [6, -9.5, 1.2, 0.6, 1.1], [-14, 8, 1, 1.4, 1.1], [14, 8, 1, 1.4, 1.1]],

// ===== test hook =====
window.KM = {
  get state() { return S; }, get ui() { return ui; }, CONFIG, R, get theatrical() { return ui.theatrical; },
  start(skipCard) { begin(!!skipCard, true); },
  press(p) { press(p); },
  setBot(k) { bot = k ? R.makeBot(k, 1234) : null; },
  fastForward(sec, policy) {
    const b = policy ? R.makeBot(policy, 99) : bot || R.makeBot('director', 99);
    for (let i = 0; i < sec * 60 && S.phase !== 'end'; i++) handle(R.step(S, b(S, DT), DT), true);
    if (S.phase === 'end' && ui.mode !== 'end') showEnd();
    return { phase: S.phase, act: S.act, t: +S.t.toFixed(1), score: S.score, mode: S.mode, killed: S.killedOff.map(k => k.id) };
  },
  actors() { return { heroes: heroActors.length, enemies: enemyActors.size }; },
  glints() { const out = []; for (const [id, A] of enemyActors) if (A.glint) { const p = A.glint.position.clone().project(mainCam);
    out.push({ id, vis: A.glint.visible, inScene: !!A.glint.parent, scale: +A.glint.scale.x.toFixed(2), sx: +p.x.toFixed(2), sy: +p.y.toFixed(2), z: +p.z.toFixed(3) }); } return out.filter(g => g.vis); },
  headCheck() { // where the robot's head bone really is, against the rules' head sphere
    const A = heroActors[S.cam]; if (!A || !A.head) return null; A.head.getWorldPosition(_v);
    return { headBoneY: +_v.y.toFixed(3), rulesHeadY: +(DIM.hero.h * HEAD_Y).toFixed(3), headR: +(DIM.hero.h * HEAD_R).toFixed(3) };
  },
};

layout();
requestAnimationFrame(frame);
// URL test scenes for headless screenshots: index.html#scene=cover | aim | slam | mook | cut | end
async function runScene(name) {
  const wait = ms => new Promise(r => setTimeout(r, ms)), until = async (f, ms = 30000) => { const t0 = performance.now(); while (!f() && performance.now() - t0 < ms) await new Promise(r => requestAnimationFrame(r)); };
  const freeze = () => { ui.mode = 'frozen'; };
  KM.setBot(name === 'cover' || name === 'aim' ? null : 'director'); KM.start(true);
  const S = KM.state; await until(() => S.phase === 'play'); await wait(400);
  if (name === 'cover' || name === 'aim') {
    const h = S.heroes[0]; h.x = 0.6; h.z = 0.9; S.camYaw = 0.25; S.camPitch = -0.1; press({ cover: true }); await wait(900);
    if (name === 'aim') { mouseR = true; await wait(600); }
    freeze();
  } else if (name === 'slam') { KM.fastForward(42); await until(() => S.phase === 'play' && S.enemies.some(e => e.alive && e.kind === 'brute' && e.set === camSet() && e.state === 'windSlam' && e.stT < 0.3)); freeze(); }
  else if (name === 'mook') { await until(() => S.phase === 'play' && S.enemies.some(e => e.alive && e.set === camSet() && e.aimT > 0 && e.aimT < 0.3 && Math.hypot(e.x - S.heroes[S.cam].x, e.z - S.heroes[S.cam].z) < 12)); freeze(); }
  else if (name === 'cut') { KM.setBot('greedy'); await until(() => fx.jitT > 1.4, 200000); freeze(); }
  else if (name === 'end') { KM.fastForward(600); }
}
addEventListener('keydown', e => { if (ui.mode === 'frozen' && e.code === 'KeyP') ui.mode = 'play'; });
loadModel().then(() => { const m = /scene=(\w+)/.exec(location.hash); if (m) runScene(m[1]); else if (ui.mode === 'loading') showTitle(); }).catch(err => {
  showScreen(`<h1>Meanwhile...</h1><h2>The reel would not load.</h2><div class="note">Couldn't fetch the character model (${String(err.message || err).slice(0, 120)}). This prototype needs an internet connection.</div>`);
  ui.mode = 'error';
});
</script>
<script>
// shows a plain message when three.js or the module fails (no internet, or an old browser)
addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n'; });
setTimeout(() => { if (!window.KM) { const el = document.getElementById('err'); el.style.display = 'block';
  el.textContent += 'three.js did not load. This prototype needs an internet connection (three.js, the character model and fonts come from CDNs).\n'; } }, 8000);
</script>
